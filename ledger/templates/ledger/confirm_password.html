{% extends "ledger/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
<div class="alert {% if danger %}critical{% else %}warning{% endif %}"><span class="ico">{% if danger %}⛔{% else %}⚠️{% endif %}</span><div>{{ warning }}</div></div>
<form method="post" class="card" novalidate>{% csrf_token %}
  {% include "ledger/_field.html" with f=form.password %}
  <div class="actions">
    <button class="btn {% if danger %}danger{% endif %}" type="submit">تأیید</button>
    <a class="btn secondary" href="{% url 'settings' %}">انصراف</a>
  </div>
</form>
{% endblock %}
