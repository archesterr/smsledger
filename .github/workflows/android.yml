name: android

# The Android app (android/). Every run: unit tests, lint and a debug APK (a test build, kept for
# 14 days). On main, with the signing key in the repo secrets (README, "Android app"): a signed
# release that the server's /android.apk hands out.
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # the release, on main only
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Tests, lint, debug build
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Lint report
        if: failure()
        run: cat app/build/reports/lint-results-debug.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: smsledger-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: no release (README, 'Android app')."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Signed release APK
        if: env.SIGNING_KEYSTORE != ''
        env:
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk smsledger.apk
          sha256sum smsledger.apk | tee smsledger.apk.sha256
      - name: Publish
        if: env.SIGNING_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${GITHUB_RUN_NUMBER}" smsledger.apk smsledger.apk.sha256 \
            --target "$GITHUB_SHA" --latest --title "Android app 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Install from your server's setup page, or put smsledger.apk in deploy/android/ (README, 'Android app')."
