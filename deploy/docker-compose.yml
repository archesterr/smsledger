services:
  smsledger:
    build: ..
    image: smsledger:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ledger:/data
    expose: ["8080"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [smsledger]

volumes:
  ledger:
  caddy_data:
